<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thailand Buildings & Population — 3D</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(255,255,255,0.94); border-radius: 10px;
    padding: 10px 14px; font-size: 13px; line-height: 1.5;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15); max-width: 350px;
  }
  #panel b { font-size: 14px; }
  #panel .sub { color: #555; font-size: 12px; }
  #panel select { width: 100%; margin: 6px 0 4px; font-size: 13px; padding: 4px; }
  #panel label { font-size: 12px; color: #333; margin-right: 10px; }
  #status { color: #a32e0e; font-size: 12px; min-height: 1.2em; }
  #legend { display: none; margin-top: 6px; font-size: 11px; color: #555; }
  #legend .bar { height: 10px; border-radius: 3px; margin: 2px 0; }
  #legend .ends { display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <b>Thailand buildings &amp; population</b><br>
  <span class="sub">Buildings: GlobalBuildingAtlas (footprints ODbL, heights CC BY-NC 4.0)<br>
  People per building: WorldPop 2027 province pop split by footprint &times; floors (est.)</span><br>
  <select id="prov"></select><br>
  <label><input type="radio" name="mode" value="buildings" checked> buildings</label>
  <label><input type="radio" name="mode" value="population"> population</label>
  <label><input type="checkbox" id="threeD"> 3D</label><br>
  <label><input type="checkbox" id="follow" checked> follow map</label>
  <div class="sub" id="meta">–</div>
  <div id="legend">
    <div class="bar" id="legendBar"></div>
    <div class="ends"><span>few</span><span id="legendMid">est. residents per building</span><span>many</span></div>
  </div>
  <div id="status"></div>
</div>
<script>
  const protocol = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", protocol.tile);

  const map = new maplibregl.Map({
    container: "map",
    style: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
    center: [100.62, 13.70],
    zoom: 10.5,
    maxBounds: [[96.5, 4.8], [106.5, 21.2]]
  });
  map.addControl(new maplibregl.NavigationControl(), "bottom-right");

  let provinces = [], current = null;
  let mode = "buildings";

  const H_COLOR = ["interpolate", ["linear"], ["coalesce", ["get", "h"], 0],
    0, "#fee5d9", 8, "#fcae91", 20, "#fb6a4a", 50, "#ef3b2c", 150, "#a50f15"];
  const P_COLOR = ["interpolate", ["linear"], ["coalesce", ["get", "p"], 0],
    0, "#ffffcc", 1, "#ffeda0", 4, "#fed976", 12, "#feb24c",
    30, "#fd8d3c", 80, "#f03b20", 250, "#800026"];

  async function loadIndex() {
    const r = await fetch("./provinces.json");
    provinces = await r.json();
    const sel = document.getElementById("prov");
    provinces.forEach(p => {
      const o = document.createElement("option");
      o.value = p.slug;
      o.textContent = `${p.name} (${(p.pop_2027||0).toLocaleString()} people)`;
      sel.appendChild(o);
    });
    sel.value = "bangkok_metropolis";
    sel.addEventListener("change", () => {
      document.getElementById("follow").checked = false;
      loadProvince(sel.value, true);
    });
    document.querySelectorAll('input[name="mode"]').forEach(el =>
      el.addEventListener("change", () => { mode = el.value; applyLayers(); }));
    document.getElementById("threeD").addEventListener("change", applyLayers);
  }

  function provinceAt(lng, lat) {
    const hits = provinces.filter(p => {
      const b = p.bbox;
      return lng >= b[0] && lng <= b[2] && lat >= b[1] && lat <= b[3];
    });
    if (!hits.length) return null;
    hits.sort((a, b) =>
      (a.bbox[2]-a.bbox[0])*(a.bbox[3]-a.bbox[1]) - (b.bbox[2]-b.bbox[0])*(b.bbox[3]-b.bbox[1]));
    return hits[0];
  }

  function setVis(id, vis) {
    if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", vis ? "visible" : "none");
  }

  function applyLayers() {
    const is3d = document.getElementById("threeD").checked;
    const isPop = mode === "population";
    setVis("buildings-fill", !isPop && !is3d);
    setVis("buildings-line", !isPop && !is3d);
    setVis("buildings-3d", !isPop && is3d);
    setVis("buildings-pop", isPop && !is3d);
    setVis("buildings-pop-3d", isPop && is3d);
    map.easeTo({ pitch: is3d ? 55 : 0, duration: 600 });
    const leg = document.getElementById("legend");
    leg.style.display = isPop ? "block" : "none";
    document.getElementById("legendBar").style.background =
      "linear-gradient(to right, #ffffcc, #ffeda0, #fed976, #feb24c, #fd8d3c, #f03b20, #800026)";
  }

  async function loadProvince(slug, fly) {
    const p = provinces.find(x => x.slug === slug);
    if (!p || current === slug) return;
    current = slug;
    document.getElementById("prov").value = slug;
    const st = document.getElementById("status");
    st.textContent = "loading " + p.name + "…";
    try {
      for (const l of ["buildings-fill", "buildings-line", "buildings-3d", "buildings-pop", "buildings-pop-3d"])
        if (map.getLayer(l)) map.removeLayer(l);
      if (map.getSource("prov")) map.removeSource("prov");
      map.addSource("prov", { type: "vector", url: "pmtiles://./" + p.pmtiles });
      map.addLayer({ id: "buildings-fill", type: "fill", source: "prov",
        "source-layer": "buildings",
        paint: { "fill-color": "#d9481c", "fill-opacity": 0.55 } });
      map.addLayer({ id: "buildings-line", type: "line", source: "prov",
        "source-layer": "buildings", minzoom: 13,
        paint: { "line-color": "#a32e0e", "line-width": 0.6, "line-opacity": 0.7 } });
      map.addLayer({ id: "buildings-3d", type: "fill-extrusion", source: "prov",
        "source-layer": "buildings",
        paint: {
          "fill-extrusion-color": H_COLOR,
          "fill-extrusion-height": ["coalesce", ["get", "h"], 4],
          "fill-extrusion-base": 0,
          "fill-extrusion-opacity": 0.9
        } });
      map.addLayer({ id: "buildings-pop", type: "fill", source: "prov",
        "source-layer": "buildings",
        paint: { "fill-color": P_COLOR, "fill-opacity": 0.75 } });
      map.addLayer({ id: "buildings-pop-3d", type: "fill-extrusion", source: "prov",
        "source-layer": "buildings",
        paint: {
          "fill-extrusion-color": P_COLOR,
          "fill-extrusion-height": ["coalesce", ["get", "h"], 4],
          "fill-extrusion-base": 0,
          "fill-extrusion-opacity": 0.9
        } });
      applyLayers();
      const per1k = p.buildings / Math.max(p.pop_2027||1, 1) * 1000;
      const covWarn = per1k < 5 ? " · ⚠ building footprints incomplete here" : "";
      document.getElementById("meta").textContent =
        `${(p.pop_2027||0).toLocaleString()} people (WorldPop 2027) · ` +
        `${p.buildings.toLocaleString()} buildings (${(p.with_height||0).toLocaleString()} with height)${covWarn} · zoom ${map.getZoom().toFixed(1)}`;
      st.textContent = "";
      if (fly) {
        const bb = p.bbox;
        map.fitBounds([[bb[0], bb[1]], [bb[2], bb[3]]], { padding: 30, maxZoom: 11 });
      }
    } catch (e) {
      st.textContent = "could not load " + slug;
      current = null;
    }
  }

  function popupHTML(f) {
    const h = f.properties.h, p = f.properties.p;
    const hTxt = h != null ? `<b style="font-size:14px">${h} m</b>` : `<span style="color:#555">height n/a</span>`;
    const pTxt = p != null ? `≈ <b>${p}</b> residents` : `residents n/a`;
    return `${hTxt}<br><span style="font-size:13px">${pTxt}</span><br><span style="font-size:11px;color:#888">est. from WorldPop 2027</span>`;
  }
  const CLICK_LAYERS = ["buildings-fill", "buildings-3d", "buildings-pop", "buildings-pop-3d"];
  map.on("load", async () => {
    await loadIndex();
    loadProvince("bangkok_metropolis", false);
    for (const l of CLICK_LAYERS) {
      map.on("click", l, (e) => {
        const f = e.features && e.features[0];
        if (!f) return;
        new maplibregl.Popup({ closeButton: false })
          .setLngLat(e.lngLat).setHTML(popupHTML(f)).addTo(map);
      });
      map.on("mouseenter", l, () => { map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", l, () => { map.getCanvas().style.cursor = ""; });
    }
  });

  let deb = null;
  map.on("moveend", () => {
    document.getElementById("meta").textContent =
      document.getElementById("meta").textContent.replace(/zoom [\d.]+/, "zoom " + map.getZoom().toFixed(1));
    if (!document.getElementById("follow").checked) return;
    clearTimeout(deb);
    deb = setTimeout(() => {
      const c = map.getCenter();
      const p = provinceAt(c.lng, c.lat);
      if (p && p.slug !== current) loadProvince(p.slug, false);
    }, 250);
  });
</script>
</body>
</html>
